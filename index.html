<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171B21" />
    <meta
      name="description"
      content="קטלוג הדגמה לחנות מוצרי חשמל: טלוויזיות, מיזוג, מטבח, מחשבים ועוד. מחירים ומלאי יעודכנו לפני השקה."
    />
    <meta property="og:title" content="שם החנות | טכנולוגיה. עיצוב. חיים." />
    <meta
      property="og:description"
      content="גלו חוויית קנייה חדשה. קטלוג מוצרים להמחשה, ללא הזמנות או תשלום."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:image" content="%BASE_URL%assets/hero-living.webp" />
    <title>שם החנות | טכנולוגיה. עיצוב. חיים.</title>
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%assets/hero-living.webp"
      imagesrcset="%BASE_URL%assets/hero-living-900.webp 900w, %BASE_URL%assets/hero-living.webp 1672w"
      imagesizes="(max-width: 640px) 100vw, 1400px"
      fetchpriority="high"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Restore a clean deep link redirected by the GitHub Pages 404 fallback.
      (function () {
        var p = new URLSearchParams(location.search).get('__route');
        if (p && p.startsWith('/') && !p.startsWith('//')) {
          history.replaceState(null, '', '%BASE_URL%'.replace(/\/$/, '') + p);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >יש להפעיל JavaScript כדי לגלוש בקטלוג ההמחשה. האתר אינו מקבל הזמנות או תשלומים.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
